name: CI

on:
  push:
    branches: [develop]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          path: mycel-rust-sdk
          submodules: false

      - name: Checkout API protos at matching ref
        id: checkout-api
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: MycelDB/mycel-api
          ref: ${{ github.ref_type == 'tag' && github.ref_name || (github.head_ref || github.ref_name) }}
          path: mycel-rust-sdk/third_party/mycel-api

      - name: Remove incomplete API checkout
        if: steps.checkout-api.outcome == 'failure'
        run: rm -rf mycel-rust-sdk/third_party/mycel-api

      - name: Checkout API protos at develop fallback
        if: steps.checkout-api.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: MycelDB/mycel-api
          ref: develop
          path: mycel-rust-sdk/third_party/mycel-api

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: CI
        working-directory: mycel-rust-sdk
        run: make ci
