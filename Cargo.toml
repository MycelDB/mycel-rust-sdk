[workspace]
members = [
    "crates/mycel-proto",
    "crates/mycel-sdk",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/myceldb/mycel-rust-sdk"

[workspace.dependencies]
bytes = "1"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
tonic-build = "0.12"
thiserror = "1"
