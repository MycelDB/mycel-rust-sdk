[package]
name = "mycel-sdk"
version = "0.8.0"
description = "Ergonomic Rust SDK for MycelDB daemon APIs"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/myceldb/mycel-rust-sdk"
documentation = "https://docs.rs/mycel-sdk"
keywords = ["myceldb", "grpc", "sdk", "database"]
categories = ["api-bindings", "database", "network-programming"]

[dependencies]
mycel-proto = { path = "../mycel-proto" }
tokio.workspace = true
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true
thiserror.workspace = true
time = { version = "0.3", features = ["parsing"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
