[package]
name = "myceldb-proto"
version = "0.21.1"
publish = false
description = "prost/tonic protobuf bindings for MycelDB daemon APIs"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/myceldb/mycel-rust-sdk"
keywords = ["myceldb", "grpc", "protobuf", "tonic"]
categories = ["api-bindings", "database", "network-programming"]

[lib]
name = "mycel"

[dependencies]
prost.workspace = true
prost-types.workspace = true
tonic.workspace = true

[build-dependencies]
tonic-build.workspace = true
protoc-bin-vendored = "3"
