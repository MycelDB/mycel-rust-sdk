[package]
name = "mycel"
version = "0.9.0"
description = "prost/tonic protobuf bindings for MycelDB daemon APIs"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/myceldb/mycel-rust-sdk"
documentation = "https://docs.rs/mycel"
keywords = ["myceldb", "grpc", "protobuf", "tonic"]
categories = ["api-bindings", "database", "network-programming"]

[dependencies]
prost.workspace = true
prost-types.workspace = true
tonic.workspace = true

[build-dependencies]
tonic-build.workspace = true
protoc-bin-vendored = "3"
